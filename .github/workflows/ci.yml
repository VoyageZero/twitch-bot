# .github/workflows/ci.yml
name: CI 

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - main 
      - dev
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable 
        uses: dtolnay/rust-toolchain@stable 
        with:
          components: clippy, rustfmt 
      
      - name: Cache cargo 
        uses: actions/cache@v4 
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git 
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
      - name: Format check 
        run: cargo fmt --all -- --check 

      - name: Clippy 
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all 

  test:
    name: Tests
    runs-on: ubuntu-latest 
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_user 
          POSTGRES_DB: vb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready 
          --health-interval 10s 
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s 
          --health-retries 5
    steps:
      - uses: actions/checkout@v4 

      - name: Install Rust stable 
        uses: dtolnay/rust-toolchain@stable 

      - name: Cache cargo 
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git 
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests 
        env:
          DATABASE_URL: postgres://test_user:test_user@localhost:5432/vb_test
          REDIS_URL: redis://localhost:6379
        run: cargo test --all 

  security:
    name: Security Audit
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit 
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  secrets:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}